name: flutter_component
description: >
  BTA shared Flutter UI components (higher-level).
  Depends on flutter_ui. Must NOT import shadcn_flutter directly.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.9.2
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_ui:
    path: ../flutter-ui

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
