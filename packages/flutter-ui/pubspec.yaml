name: flutter_ui
description: >
  BTA shared Flutter design system. This is the ONLY package allowed to
  import shadcn_flutter directly. All other packages and apps must import
  from this package instead.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.9.2
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.14
  # IMPORT GUARD: shadcn_flutter (if/when added) must only be imported inside THIS package.
  # Do NOT import shadcn_flutter directly from apps or flutter_component.
  # Current components use Flutter Material as implementation base.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/glowfox-logo.svg
    - assets/icons/glowfox-wordmark.svg
